name: "\U0001F4A5 Report a bug"
description: Report a bug to help us improve
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you ran into **clearly and thoroughly**.
        Do not include real congregation data (names, addresses, phone numbers...) or screenshots that show it.
  - type: textarea
    id: description
    attributes:
      label: Description of the problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you were doing, what you clicked on, etc.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If possible, add one or more screenshots of the problem (you can drag them here).
  - type: input
    id: instance
    attributes:
      label: Where did you run into the problem?
      description: Address of the installation (e.g. your congregation's, or one of the demos). Remove it if you prefer not to share it.
      placeholder: "E.g. https://ochdemo.altervista.org"
  - type: input
    id: app_environment
    attributes:
      label: Environment
      description: Environment of the app (`APP_ENV`), if you know it.
      placeholder: "E.g. production"
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the app in use, if you know it.
      placeholder: "E.g. v1.0.0-alpha11"
  - type: textarea
    id: stack
    attributes:
      label: PHP, Laravel and Filament versions
      description: The versions the app runs on, if you know them.
      placeholder: |
        - PHP: `8.3.6`
        - Laravel: `12.72.0`
        - Filament: `5.11.3`
  - type: textarea
    id: browser
    attributes:
      label: Device and browser
      description: Operating system, device and browser on which the problem occurred.
      placeholder: "E.g. Android 15, Chrome 142"
