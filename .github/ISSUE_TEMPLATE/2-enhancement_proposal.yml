name: "\U0001F680 Suggest an enhancement"
description: Explain how an existing feature could be improved
labels: ["enhancement"]
body:
  - type: input
    id: feature
    attributes:
      label: Feature to improve
      description: Which feature or page of the app is the suggestion about?
      placeholder: "E.g. territory assignments, dashboard, notifications..."
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How it works today
      description: Describe the current behavior and what does not convince you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could be improved
      description: Describe the enhancement you propose and why it would be useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional information
      description: Screenshots, sketches or any other useful detail.
