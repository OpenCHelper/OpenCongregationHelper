name: "✨ Propose a new feature"
description: Propose a feature that does not exist yet
labels: ["new feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your proposal! If you would rather improve a feature that already exists, use the **🚀 Suggest an enhancement** form instead.
  - type: textarea
    id: problem
    attributes:
      label: What need would it address?
      description: Describe the problem or the congregation's situation that the app cannot handle today.
      placeholder: "E.g. today I cannot..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Describe the feature you have in mind, who would use it and in which pages.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you handle this need today? Have you thought of other solutions?
  - type: textarea
    id: context
    attributes:
      label: Additional information
      description: Screenshots, sketches, examples from other applications or any other useful detail.
