name: Run E2E tests

on:
  # Every pull request (forks included), and what lands on main
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Manually trigger a workflow run

permissions:
  contents: read

env:
  # Same major version installed in the Sail image (see docker-compose.yml)
  node_version: "24.x"
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib

jobs:
  run-e2e:
    name: Run E2E tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The application supports these databases: each one runs the whole suite, the setup wizard included (which
    # configures the database of its run, see `tests/e2e/setup-wizard.spec.ts`). PostgreSQL is not supported yet.
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
        include:
          - database: sqlite
            mysql_image: ""
          - database: mysql
            # Same version as docker-compose.yml
            mysql_image: mysql:8.0
            port: 3306
            username: root

    # A service with an empty image is not started: only the runs on MySQL have it
    services:
      mysql:
        image: ${{ matrix.mysql_image }}
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 -uroot -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      # Read by `tests/e2e/support/serve.sh` and the setup wizard test
      E2E_DB_CONNECTION: ${{ matrix.database }}
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: ${{ matrix.port }}
      E2E_DB_USERNAME: ${{ matrix.username }}
      E2E_DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          # The version of the platform of composer.json
          php-version: "8.2"
          extensions: ${{ env.php_extensions }}
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --no-scripts --optimize-autoloader

      # The assets must be built after the Composer dependencies are installed, since the Filament themes import CSS
      # from `vendor`
      - name: Install NodeJS dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.database }}
          path: |
            playwright-report/
            test-results/
            storage/e2e/*/logs/
          retention-days: 14

      - name: Explain how to debug the failed tests
        if: failure()
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          {
            echo "### Debugging the failed E2E tests (${DATABASE})"
            echo
            echo "Download the \`playwright-report-${DATABASE}\` artifact of this run, unzip it, then:"
            echo
            echo "- \`npx playwright show-report playwright-report\`: the report, with the screenshot, the video and the trace of each failed test;"
            echo "- \`npx playwright show-trace test-results/<test>/trace.zip\` (or drop the file on https://trace.playwright.dev) to replay a test step by step, with the page, the network and the console;"
            echo "- \`storage/e2e/<instance>/logs/laravel.log\`: the errors of the application."
          } >> "$GITHUB_STEP_SUMMARY"
