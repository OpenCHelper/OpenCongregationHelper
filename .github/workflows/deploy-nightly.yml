name: Deploy (Nightly)

# Deploys every push to `main` to the `Nightly` GitHub environment, with fresh dummy data. The environment holds the
# FTP_SERVER and FTP_USERNAME variables, the FTP_PASSWORD, ROOT_PASSWORD and CRON_JOB_ORG_API_KEY secrets, and the
# optional ARTISAN_CRON_TOKEN secret; the `.env` file is written on every deployment (see the `dotenv` input below).
on:
  push:
    branches:
      - main
  workflow_dispatch: # Manually trigger a workflow run

permissions:
  contents: read

# One deployment at a time, to avoid overloading the server: a newer run cancels the one in progress
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linter:
    uses: ./.github/workflows/run-linter.yml

  deploy:
    needs: linter
    uses: ./.github/workflows/upload-altervista-reusable.yml
    with:
      environment: Nightly
      label: Nightly
      reset-database: true
      seed-dummy-data: true
      install-dev-dependencies: false
      # The space may also host the PR previews: each environment has its own folder (see the README), and Nightly is
      # deployed as a single archive unpacked on the server
      environment-folder: nightly
      # Scheduler cron job on cron-job.org, with the CRON_JOB_ORG_API_KEY secret of the Nightly environment: every 5
      # minutes from 8:00 to 22:55 (Rome time) on weekdays. Not worth failing the deployment for (e.g. API rate limit).
      # With the ARTISAN_CRON_TOKEN secret, the job keeps its token and is only synchronized by manual runs and re-runs
      cron-folder: (Nightly)
      cron-optional: true
      # The `.env` file of Nightly, written on every deployment with a new `APP_KEY`, the `ARTISAN_CRON_TOKEN` (the
      # secret of the same name, or a new random one) and the `ROOT_PASSWORD` secret of the Nightly environment as
      # `INITIAL_ROOT_PASSWORD` (the database has no password)
      dotenv: |
        APP_NAME='OpenCongregationHelper (Nightly)'
        APP_ENV='nightly'
        APP_DEBUG=false
        APP_URL='https://ochtest.altervista.org'
        ASSET_URL='https://ochtest.altervista.org'
        APP_VERSION_BRANCH_FILE='.git-branch-name'
        APP_VERSION_COMMIT_FILE='.git-commit-hash'
        APP_LOCALE='en'
        APP_FALLBACK_LOCALE='en'
        LOG_CHANNEL='single'
        LOG_LEVEL='info'
        DB_CONNECTION='mysql'
        DB_HOST='localhost'
        DB_PORT=3306
        DB_DATABASE='my_ochtest'
        DB_USERNAME='ochtest'
        DB_PASSWORD=''
        DB_ENGINE='InnoDB'
        # At most 6 characters: longer ones push some index names past the 64 characters allowed by MySQL
        DB_PREFIX='nite_'
        SESSION_DRIVER='database'
        CACHE_STORE='database'
        QUEUE_CONNECTION='sync'
        MAIL_MAILER='log'
        INITIAL_ROOT_USERNAME='Root User'
        INITIAL_ROOT_USERMAIL='root@example.com'
        DEMO_PREFILL_LOGIN_CREDENTIALS=true
    # The FTP credentials are the secrets of the GitHub environment
    secrets: inherit
