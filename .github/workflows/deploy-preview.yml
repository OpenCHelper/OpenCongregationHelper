name: Deploy (PR previews)

# Every open PR gets its own preview, like Vercel/Render: https://pr-<N>.<site>.altervista.org, redeployed with fresh
# dummy data on every push and removed when the PR is closed or merged.
#
# All the previews share one Altervista space and database (a dedicated one, or the TEST one: see the README): each one
# lives in `previews/pr-<N>/` and prefixes its tables with `p<N>_` (`DB_PREFIX`). The release is uploaded through FTP
# as a single archive and unpacked on the server by the `ftp-archive-deploy` action (`.github/actions/`).
#
# Altervista has no cron: cron-job.org runs the scheduler and the queue of each preview, through the jobs of its own
# folder, `(Preview) PR-<N>`, created (or updated) on every deployment and deleted with the preview.
#
# Settings of the PREVIEW GitHub environment:
#   - variables: FTP_SERVER, FTP_USERNAME (the web space; they can be secrets too, but GitHub then hides the URLs of
#     the previews, which contain them);
#   - secrets: FTP_PASSWORD, ROOT_PASSWORD (root user of the previews, pre-filled on their login page, so public: never
#     reuse a real password), CRON_JOB_ORG_API_KEY (API key of cron-job.org);
#   - optional secrets: DB_DATABASE, DB_USERNAME, DB_PASSWORD (its database, by default the one of the Altervista
#     account: `my_<FTP username>`, user `<FTP username>`, no password);
#   - optional variables: ROOT_EMAIL (default: root@example.com), MAX_PREVIEWS (live previews, default: 5).
# Repository variables: SPACE_DEFAULT_ENVIRONMENT, SPACE_PHP_HANDLER (the router of the space, shared with TEST).
#
# Which PRs get a preview: the `PREVIEW_MODE` repository variable sets the default, the labels of each PR override it.
#   - `opt-out` (default): every PR, unless it has the opt-out label;
#   - `opt-in`: only the PRs with the opt-in label;
#   - `off`: none (e.g. while the space is unavailable).
# The labels are set by the `PREVIEW_OPT_IN_LABEL` (default: `preview: on`) and `PREVIEW_OPT_OUT_LABEL` (default:
# `preview: off`) repository variables, and must be different. The opt-out label wins over the opt-in one. Adding or
# removing a label deploys or removes the preview right away, and the weekly cleanup removes the previews of the PRs
# that no longer want one (e.g. after switching the mode to `off`).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled, unlabeled]
  schedule:
    # Weekly removal of the previews of PRs that are no longer open (e.g. a failed teardown)
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "deploy/destroy the preview of a PR, or clean up the previews of the PRs not open or not wanting one"
        type: choice
        options: [deploy, destroy, cleanup]
        default: deploy
      pr:
        description: "PR number (deploy and destroy only)"
        type: string
        required: false

permissions:
  contents: read

# One run per PR at a time: a newer run (a push, closing the PR, a label, a manual run) cancels the one in progress.
# Except adding or removing any other label, which does nothing and gets its own group, so as not to cancel a
# deployment (the defaults of the labels must match the `opt_in_label` and `opt_out_label` below).
concurrency:
  group: >-
    preview-${{ github.event.pull_request.number || inputs.pr || 'cleanup' }}${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled')
        && github.event.label.name != (vars.PREVIEW_OPT_IN_LABEL || 'preview: on')
        && github.event.label.name != (vars.PREVIEW_OPT_OUT_LABEL || 'preview: off')
        && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Tables of the previews are prefixed with `p<N>_`, which must stay within 6 characters (see `SpaceDeployer`)
  max_pr_number: 9999
  # Folder of the cron jobs of each preview on cron-job.org (followed by the number of the PR), and their schedule: every
  # 5 minutes, from 8:00 to 22:55, Monday to Friday
  cron_folder_prefix: "(Preview) PR-"
  cron_schedule: "*/5 8-22 * * 1-5"
  cron_timezone: Europe/Rome
  # Labels of a PR to opt in to its preview (needed with `PREVIEW_MODE=opt-in`) or out of it (see the top)
  opt_in_label: "${{ vars.PREVIEW_OPT_IN_LABEL || 'preview: on' }}"
  opt_out_label: "${{ vars.PREVIEW_OPT_OUT_LABEL || 'preview: off' }}"

jobs:
  # What to do, before touching the secrets of the PREVIEW environment: `deploy` or `destroy` the preview of `pr`,
  # `cleanup` the previews of the PRs other than `keep` (those open and wanting one), or `none`
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Creating the labels (see below)
      issues: write
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      pr: ${{ steps.decide.outputs.pr }}
      keep: ${{ steps.decide.outputs.keep }}
    steps:
      # Only the missing ones, so that their colour and description can be changed on GitHub. Not in the runs of PRs from
      # forks or started by Dependabot, whose token is read-only, and never failing the run: the labels are a convenience
      - name: Create the opt-in/out labels
        if: >-
          github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name --jq '.[].name')"

          create () {
            if grep -qxF "$1" <<< "$existing"; then
              return
            fi
            if gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3"; then
              echo "Created the '${1}' label."
            else
              echo "::warning::Could not create the '${1}' label: create it on GitHub (Issues > Labels)."
            fi
          }

          create "$opt_in_label" 0E8A16 "Deploy a preview of this PR"
          create "$opt_out_label" B60205 "No preview for this PR"

      - name: Decide what to do
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.PREVIEW_MODE || 'opt-out' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ACTOR: ${{ github.actor }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          if [[ ! "$MODE" =~ ^(opt-in|opt-out|off)$ ]]; then
            echo "::error::Invalid PREVIEW_MODE repository variable '${MODE}': use opt-in, opt-out or off."
            exit 1
          fi
          if [[ "$opt_in_label" == "$opt_out_label" ]]; then
            echo "::error::The PREVIEW_OPT_IN_LABEL and PREVIEW_OPT_OUT_LABEL repository variables must be different labels."
            exit 1
          fi

          # Whether a PR with the given labels (JSON array of names) wants a preview
          # shellcheck disable=SC2016 # A jq program: its variables are jq's, passed with `--arg`
          wants='def wants: ($mode != "off") and (index($opt_out) | not) and ($mode == "opt-out" or (index($opt_in) != null));'
          wants () {
            jq -e --arg mode "$MODE" --arg opt_in "$opt_in_label" --arg opt_out "$opt_out_label" \
              "${wants} wants" <<< "$1" > /dev/null
          }

          decide () {
            echo "action=$1" >> "$GITHUB_OUTPUT"
            [[ -z "${2:-}" ]] || echo "pr=$2" >> "$GITHUB_OUTPUT"
            echo "Action: $1${2:+ (PR #$2)}, PREVIEW_MODE=${MODE}${3:+: $3}" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          case "$EVENT_NAME" in
            schedule)
              INPUT_ACTION=cleanup
              ;&
            workflow_dispatch)
              if [[ "$INPUT_ACTION" == "cleanup" ]]; then
                keep="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,labels \
                  | jq -r --arg mode "$MODE" --arg opt_in "$opt_in_label" --arg opt_out "$opt_out_label" \
                    "${wants}"' .[] | select([.labels[].name] | wants) | .number' | paste -sd ' ')"
                echo "keep=${keep}" >> "$GITHUB_OUTPUT"
                decide cleanup "" "keeping the previews of ${keep:-no PR}"
                exit 0
              fi

              if [[ ! "$INPUT_PR" =~ ^[0-9]+$ ]]; then
                echo "::error::The 'pr' input must be the number of a PR."
                exit 1
              fi

              if [[ "$INPUT_ACTION" == "deploy" ]]; then
                labels="$(gh pr view "$INPUT_PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"
                if ! wants "$labels"; then
                  echo "::error::PR #${INPUT_PR} does not want a preview (PREVIEW_MODE=${MODE}): add the '${opt_in_label}' label (and remove '${opt_out_label}'), or change PREVIEW_MODE. Otherwise the weekly cleanup would remove it."
                  exit 1
                fi
              fi

              decide "$INPUT_ACTION" "$INPUT_PR"
              ;;

            pull_request)
              # No secrets in the runs started by Dependabot, as in the PRs from forks: Dependabot's PRs are deployed
              # manually (or by labelling them), and closing them leaves their preview, if any, to the weekly cleanup
              if [[ "$IS_FORK" == "true" ]] || [[ "$ACTOR" == "dependabot[bot]" ]]; then
                decide none "$EVENT_PR" "PR from a fork or run by Dependabot"
              elif [[ "$EVENT_ACTION" == "closed" ]]; then
                decide destroy "$EVENT_PR"
              elif [[ "$EVENT_ACTION" == "labeled" || "$EVENT_ACTION" == "unlabeled" ]]; then
                if [[ "$EVENT_LABEL" != "$opt_in_label" && "$EVENT_LABEL" != "$opt_out_label" ]]; then
                  decide none "$EVENT_PR" "the '${EVENT_LABEL}' label does not affect the preview"
                  exit 0
                fi

                # The labels before the event: only a change of whether the PR wants a preview does something
                if [[ "$EVENT_ACTION" == "labeled" ]]; then
                  before="$(jq -c --arg label "$EVENT_LABEL" 'map(select(. != $label))' <<< "$EVENT_LABELS")"
                else
                  before="$(jq -c --arg label "$EVENT_LABEL" '. + [$label]' <<< "$EVENT_LABELS")"
                fi
                wanted_before=false; wants "$before" && wanted_before=true
                wanted_now=false; wants "$EVENT_LABELS" && wanted_now=true

                if [[ "$wanted_before" == "$wanted_now" ]]; then
                  decide none "$EVENT_PR" "the labels do not change whether the PR wants a preview"
                elif [[ "$wanted_now" == "true" ]]; then
                  decide deploy "$EVENT_PR" "opted in"
                else
                  decide destroy "$EVENT_PR" "opted out"
                fi
              elif wants "$EVENT_LABELS"; then
                decide deploy "$EVENT_PR"
              else
                decide none "$EVENT_PR" "the PR does not want a preview (labels: '${opt_in_label}' to opt in, '${opt_out_label}' to opt out)"
              fi
              ;;

            *)
              decide none
              ;;
          esac

  deploy:
    name: Deploy preview
    needs: decide
    if: needs.decide.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: PREVIEW
      url: ${{ steps.resolve.outputs.url }}
    defaults:
      run:
        shell: bash
    env:
      FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Resolve the preview
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_PR: ${{ inputs.pr }}
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
        run: |
          if [[ -n "$EVENT_PR" ]]; then
            pr="$EVENT_PR" sha="$EVENT_SHA" branch="$EVENT_BRANCH"
          else
            if [[ ! "$INPUT_PR" =~ ^[0-9]+$ ]]; then
              echo "::error::The 'pr' input must be the number of the PR to deploy."
              exit 1
            fi

            pr_details="$(gh pr view "$INPUT_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRefName,state,isCrossRepository)"
            if [[ "$(jq -r '.state' <<< "$pr_details")" != "OPEN" ]] || [[ "$(jq -r '.isCrossRepository' <<< "$pr_details")" == "true" ]]; then
              echo "::error::PR #${INPUT_PR} must be open and come from a branch of this repository."
              exit 1
            fi

            pr="$INPUT_PR"
            sha="$(jq -r '.headRefOid' <<< "$pr_details")"
            branch="$(jq -r '.headRefName' <<< "$pr_details")"
          fi

          if (( pr > max_pr_number )); then
            echo "::error::PR numbers above ${max_pr_number} are not supported: the table prefix would be too long."
            exit 1
          fi

          if [[ -z "$FTP_SERVER" ]]; then
            echo "::error::The FTP_SERVER variable of the PREVIEW environment is not set: see the comments at the top of this workflow."
            exit 1
          fi

          # Before the build: the cron jobs are created at the end of the deployment
          if [[ -z "$CRON_JOB_ORG_API_KEY" ]]; then
            echo "::error::The CRON_JOB_ORG_API_KEY secret of the PREVIEW environment is not set: see the comments at the top of this workflow."
            exit 1
          fi

          site="${FTP_SERVER##ftp.}"
          {
            echo "pr=${pr}"
            echo "sha=${sha}"
            echo "branch=${branch}"
            echo "slug=pr-${pr}"
            echo "prefix=p${pr}_"
            echo "site=${site}"
            echo "url=https://pr-${pr}.${site}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      # On pull requests, the router of the space, shared by all the previews (and by TEST, when the space hosts it
      # too), is written by the action of the default branch, so that a PR cannot break the other environments by
      # mistake: dispatch the workflow on a branch to try changes to it. The deployer is versioned instead.
      - name: Checkout the action of the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.ref }}
          path: .ftp-archive-deploy-source
          sparse-checkout: .github/actions/ftp-archive-deploy

      - name: Comment on the PR (deploying)
        uses: ./.github/actions/preview-comment
        with:
          pr: ${{ steps.resolve.outputs.pr }}
          status: deploying
          url: ${{ steps.resolve.outputs.url }}
          sha: ${{ steps.resolve.outputs.sha }}

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y jq lftp zip

      - name: Install the router of the space
        env:
          SITE: ${{ steps.resolve.outputs.site }}
          SPACE_DEFAULT_ENVIRONMENT: ${{ vars.SPACE_DEFAULT_ENVIRONMENT }}
          SPACE_PHP_HANDLER: ${{ vars.SPACE_PHP_HANDLER }}
        run: |
          # Shared with the other workflows deploying to the space: the same settings for all of them
          if [[ -z "$SPACE_DEFAULT_ENVIRONMENT" ]] || [[ -z "$SPACE_PHP_HANDLER" ]]; then
            echo "::error::Set the SPACE_DEFAULT_ENVIRONMENT (e.g. test) and SPACE_PHP_HANDLER (e.g. av-php82) repository variables: see the README."
            exit 1
          fi

          action_dir=.ftp-archive-deploy-source/.github/actions/ftp-archive-deploy
          if [[ ! -f "${action_dir}/router/root.htaccess" ]]; then
            # Until the router is merged into the default branch (e.g. in the PR adding it)
            echo "::warning::The default branch has no router yet: using the one of the PR."
            action_dir=.github/actions/ftp-archive-deploy
          fi

          "${action_dir}/deploy.sh" --base-url "https://${SITE}" \
            --ftp-hostname "$FTP_SERVER" --ftp-username "$FTP_USERNAME" --ftp-password "$FTP_PASSWORD" \
            --default-environment "$SPACE_DEFAULT_ENVIRONMENT" --php-handler "$SPACE_PHP_HANDLER" --previews \
            install-router

      - name: Check the server and the number of previews
        env:
          SITE: ${{ steps.resolve.outputs.site }}
          SLUG: ${{ steps.resolve.outputs.slug }}
          MAX_PREVIEWS: ${{ vars.MAX_PREVIEWS || 5 }}
        run: |
          deployer () {
            .github/actions/ftp-archive-deploy/deploy.sh --base-url "https://${SITE}" \
              --ftp-hostname "$FTP_SERVER" --ftp-username "$FTP_USERNAME" --ftp-password "$FTP_PASSWORD" "$@"
          }

          info="$(deployer info)"
          echo "Server: $(jq -c 'del(.success)' <<< "$info")"
          if [[ "$(jq -r '.zip' <<< "$info")" != "true" ]]; then
            echo "::error::The ZipArchive PHP extension is not available on the server."
            exit 1
          fi

          previews="$(deployer list | jq -r '.previews[]')"
          echo "Live previews: ${previews//$'\n'/, }"

          if ! grep -qx "$SLUG" <<< "$previews" && (( $(grep -c . <<< "$previews") >= MAX_PREVIEWS )); then
            echo "::error::There are already ${MAX_PREVIEWS} live previews (the disk space is limited): close a PR, or raise the MAX_PREVIEWS variable of the PREVIEW environment."
            exit 1
          fi

      - name: Build application
        uses: ./.github/actions/build-application
        with:
          install-dev-dependencies: false

      - name: Create the environment file
        id: environment-file
        env:
          PR: ${{ steps.resolve.outputs.pr }}
          SHA: ${{ steps.resolve.outputs.sha }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          URL: ${{ steps.resolve.outputs.url }}
          PREFIX: ${{ steps.resolve.outputs.prefix }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ROOT_EMAIL: ${{ vars.ROOT_EMAIL || 'root@example.com' }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          # By default, the database of the Altervista account: `my_<username>`, user `<username>`, no password (it is
          # only reachable from the server itself)
          DB_DATABASE="${DB_DATABASE:-my_${FTP_USERNAME}}"
          DB_USERNAME="${DB_USERNAME:-${FTP_USERNAME}}"

          # Values are single-quoted, so that they are read literally (no `${...}` interpolation)
          for name in DB_DATABASE DB_USERNAME DB_PASSWORD ROOT_EMAIL ROOT_PASSWORD; do
            if [[ "${!name}" == *"'"* ]]; then
              echo "::error::The value of ${name} cannot contain single quotes."
              exit 1
            fi
          done

          if [[ -z "$ROOT_PASSWORD" ]]; then
            echo "::error::The ROOT_PASSWORD secret of the PREVIEW environment is not set."
            exit 1
          fi

          # Secret sent by the cron jobs of the preview to its scheduler and queue endpoints: a new one on every
          # deployment, also given to the cron jobs
          cron_token="$(openssl rand -hex 32)"
          echo "::add-mask::${cron_token}"
          echo "cron-token=${cron_token}" >> "$GITHUB_OUTPUT"

          cat > .env <<EOF
          APP_NAME='OpenCongregationHelper (PR #${PR})'
          APP_ENV='preview'
          APP_KEY='$(php artisan key:generate --show --no-ansi)'
          $(php artisan webpush:vapid --show --no-ansi | sed -n "s/^\(VAPID_[A-Z_]*\)=\(.*\)$/\1='\2'/p")
          APP_DEBUG=true
          APP_URL='${URL}'
          APP_VERSION_BRANCH_FILE='.git-branch-name'
          APP_VERSION_COMMIT_FILE='.git-commit-hash'
          APP_LOCALE='it'
          APP_FALLBACK_LOCALE='en'
          ARTISAN_CRON_TOKEN='${cron_token}'
          LOG_CHANNEL='single'
          LOG_LEVEL='debug'
          DB_CONNECTION='mysql'
          DB_HOST='localhost'
          DB_PORT=3306
          DB_DATABASE='${DB_DATABASE}'
          DB_USERNAME='${DB_USERNAME}'
          DB_PASSWORD='${DB_PASSWORD}'
          DB_ENGINE='InnoDB'
          DB_PREFIX='${PREFIX}'
          SESSION_DRIVER='database'
          CACHE_STORE='database'
          QUEUE_CONNECTION='sync'
          MAIL_MAILER='log'
          INITIAL_ROOT_USERNAME='Root User'
          INITIAL_ROOT_USERMAIL='${ROOT_EMAIL}'
          INITIAL_ROOT_PASSWORD='${ROOT_PASSWORD}'
          DEMO_PREFILL_LOGIN_CREDENTIALS=true
          EOF

          echo "${SHA}" > .git-commit-hash
          echo "ref: refs/heads/${BRANCH}" > .git-branch-name

      # Upload a single archive, unpacked in batches (each within the PHP time limit of the server), then swapped with
      # the live preview
      - name: Upload and unpack the release
        uses: ./.github/actions/ftp-archive-deploy
        with:
          ftp-server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          url: https://${{ steps.resolve.outputs.site }}
          target: ${{ steps.resolve.outputs.slug }}
          # A push that changes no Composer package uploads only the autoloader of `vendor/`
          reuse-vendor: true

      # Fresh data on every push: drop the tables of the preview (and only them) before migrating again
      - name: Drop the database tables of the preview
        env:
          SITE: ${{ steps.resolve.outputs.site }}
          SLUG: ${{ steps.resolve.outputs.slug }}
        run: |
          .github/actions/ftp-archive-deploy/deploy.sh --base-url "https://${SITE}" \
            --ftp-hostname "$FTP_SERVER" --ftp-username "$FTP_USERNAME" --ftp-password "$FTP_PASSWORD" \
            reset-database "$SLUG" | jq -r '.dropped | length | "Dropped \(.) tables"'

      - name: Migrate and seed the database
        id: migrate
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.resolve.outputs.url }}
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          token-file: previews/${{ steps.resolve.outputs.slug }}/storage/framework/.artisan-token
          log-file: ${{ runner.temp }}/artisan-commands-output.txt
          commands: |
            # No `optimize:clear` first: the release is built from scratch, and it would fail on the missing cache table

            # The tables were already dropped by the deployer (which works even when the application cannot boot)
            artisan migrate --seed
            artisan db:seed --class=FakeDataSeeder
            artisan shield:super-admin --user=1 --panel=app

            # The `public/storage` link is never deployed (the build's one would be uploaded as a plain folder)
            artisan storage:link --force

            artisan config:cache
            artisan event:cache
            artisan route:cache
            artisan view:cache
            artisan filament:cache-components
            artisan filament:optimize

      # Once the preview runs with the new token: the jobs of its folder are matched by title, so that every push
      # updates them (with the new token) instead of creating them again.
      #
      # cron-job.org rate limits its API (HTTP 429): the jobs are only needed by the scheduler and the queue, so the
      # preview is still deployed without them (the action already retries for ~30s), with a warning.
      - name: Create the cron jobs of the preview
        id: cron
        continue-on-error: true
        uses: LukeSavefrogs/cron-job-org-action@v2
        with:
          api-key: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          folder: ${{ env.cron_folder_prefix }}${{ steps.resolve.outputs.pr }}
          base-url: ${{ steps.resolve.outputs.url }}
          timezone: ${{ env.cron_timezone }}
          schedule: ${{ env.cron_schedule }}
          method: POST
          headers: |
            X-Cron-Token: ${{ steps.environment-file.outputs.cron-token }}
          jobs: |
            - title: Schedule run
              url: /api/artisan/schedule/process
            - title: Queue run
              url: /api/artisan/queue/process

      - name: Warn about the missing cron jobs
        id: cron-result
        env:
          CRON_OUTCOME: ${{ steps.cron.outcome }}
        run: |
          if [[ "$CRON_OUTCOME" == 'success' ]]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The cron jobs of the preview could not be created on cron-job.org: its scheduler and queue do not run. Re-run the workflow to retry."
          fi

      - name: Check the certificate of the preview
        env:
          URL: ${{ steps.resolve.outputs.url }}
        run: |
          # The Artisan client does not verify it, but browsers do: the certificate of the site may not cover subdomains
          status=0
          curl -sS -o /dev/null --max-time 30 "${URL}/up" || status=$?
          if (( status == 51 || status == 60 )); then
            echo "::warning::The HTTPS certificate is not valid for ${URL}: browsers warn before opening the preview."
          elif (( status != 0 )); then
            echo "::warning::${URL}/up did not answer (curl exit code ${status})."
          fi

      # An error 500 without a body means that the request did not reach the application (e.g. a `.htaccess` directive
      # rejected by the hosting): show what the preview answers, and the end of the log of the application
      - name: Show the diagnostics of the preview
        if: failure() && steps.migrate.outcome == 'failure'
        env:
          URL: ${{ steps.resolve.outputs.url }}
          SLUG: ${{ steps.resolve.outputs.slug }}
        run: |
          echo "::group::Response of ${URL}/up"
          # Without `--insecure` first, to show whether the certificate is valid for the subdomain of the preview
          curl -sS -i --max-time 30 "${URL}/up" || curl -sS -i --insecure --max-time 30 "${URL}/up" || true
          echo
          echo "::endgroup::"

          echo "::group::End of the log of the application"
          lftp -e "set ssl:check-hostname no; cat 'previews/${SLUG}/storage/logs/laravel.log'; bye" \
            -u "${FTP_USERNAME},${FTP_PASSWORD}" "$FTP_SERVER" 2>&1 | tail -n 100 || true
          echo "::endgroup::"

      - name: Set summary
        env:
          URL: ${{ steps.resolve.outputs.url }}
          SHA: ${{ steps.resolve.outputs.sha }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          ROOT_EMAIL: ${{ vars.ROOT_EMAIL || 'root@example.com' }}
          CRON_FOLDER: ${{ env.cron_folder_prefix }}${{ steps.resolve.outputs.pr }}
          CRON_CREATED: ${{ steps.cron-result.outputs.created }}
        run: |
          if [[ "$CRON_CREATED" == 'true' ]]; then
            cron_line="scheduler and queue (\`${cron_schedule}\`, ${cron_timezone}), in the \`${CRON_FOLDER}\` folder of cron-job.org"
          else
            cron_line="⚠️ **not created** (cron-job.org refused them): the scheduler and the queue do not run, re-run the workflow to retry"
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Preview deployed

          - **URL**: ${URL}
          - **Branch**: \`${BRANCH}\` (\`${SHA:0:7}\`)
          - **Login**: \`${ROOT_EMAIL}\`, pre-filled on the login page (public demo: dummy data only, never real data)
          - **Cron jobs**: ${cron_line}

          <details>
          <summary>Artisan output</summary>

          \`\`\`plaintext
          $(cat "${RUNNER_TEMP}/artisan-commands-output.txt" 2> /dev/null)
          \`\`\`

          </details>
          EOF

      - name: Comment on the PR (result)
        if: always() && steps.resolve.outputs.pr != ''
        uses: ./.github/actions/preview-comment
        with:
          pr: ${{ steps.resolve.outputs.pr }}
          status: ${{ job.status == 'success' && 'ready' || (job.status == 'cancelled' && 'cancelled' || 'failed') }}
          url: ${{ steps.resolve.outputs.url }}
          sha: ${{ steps.resolve.outputs.sha }}
          login: ${{ vars.ROOT_EMAIL || 'root@example.com' }}
          warning: >-
            ${{ steps.cron-result.outputs.created == 'false'
              && 'The cron jobs could not be created on cron-job.org: the scheduler and the queue do not run. Re-run the workflow to retry.'
              || '' }}

  destroy:
    name: Remove previews
    needs: decide
    if: needs.decide.outputs.action == 'destroy' || needs.decide.outputs.action == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    # The secrets of the environment, without recording a deployment
    environment:
      name: PREVIEW
      deployment: false
    defaults:
      run:
        shell: bash
    env:
      FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      # The scripts of the default branch: the PR may have been merged or its branch deleted
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.ref }}

      # Until the previews are merged into the default branch (e.g. closing the PR adding them without merging it)
      - name: Checkout the PR
        if: hashFiles('.github/actions/ftp-archive-deploy/deploy.sh') == '' && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y jq lftp

      - name: Remove the previews
        id: remove
        env:
          PR: ${{ needs.decide.outputs.pr }}
          KEEP: ${{ needs.decide.outputs.keep }}
        run: |
          deployer () {
            .github/actions/ftp-archive-deploy/deploy.sh --base-url "https://${FTP_SERVER##ftp.}" \
              --ftp-hostname "$FTP_SERVER" --ftp-username "$FTP_USERNAME" --ftp-password "$FTP_PASSWORD" "$@"
          }

          listing="$(deployer list)"

          if [[ -n "$PR" ]]; then
            slugs="pr-${PR}"
            echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          else
            # Previews (and leftovers) of the PRs that are no longer open or no longer want one (see the `decide` job)
            keep_slugs="$(tr ' ' '\n' <<< "$KEEP" | sed '/^$/d; s/^/pr-/')"
            slugs="$(jq -r '(.previews + (.leftovers | map(sub("\\.(next|old|zip)$"; "")))) | unique | .[]' <<< "$listing" \
              | grep -vxF -f <(printf '%s\n' "$keep_slugs") || true)"
          fi

          remove_preview () {
            local slug="$1"

            if jq -e --arg slug "$slug" '.previews | index($slug)' <<< "$listing" > /dev/null; then
              # Before deleting the files: the connection and the table prefix are read from the `.env` file
              deployer reset-database "$slug" || return 1
              deployer deactivate "$slug" > /dev/null || return 1
            fi

            for variant in old next zip; do
              deployer delete "$slug" "$variant" > /dev/null || return 1
            done
          }

          failed=()
          removed=()
          for slug in $slugs; do
            echo "::group::Removing ${slug}"
            if remove_preview "$slug"; then
              removed+=("${slug#pr-}")
              echo "- Removed \`${slug}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              failed+=("$slug")
              echo "- **Failed** to remove \`${slug}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

          [[ -n "$slugs" ]] || echo "Nothing to remove." >> "$GITHUB_STEP_SUMMARY"

          # The PRs whose preview is gone, whose deployments are then marked as inactive
          echo "prs=${removed[*]}" >> "$GITHUB_OUTPUT"

          if (( ${#failed[@]} > 0 )); then
            echo "::error::Failed to remove: ${failed[*]} (see the logs above)."
            exit 1
          fi

      # Even when the files could not be removed: the cron jobs of a PR without a preview are useless. The cleanup
      # removes the folders of every PR that is no longer open or no longer wants a preview, also when the files of its
      # preview are already gone (e.g. a teardown that failed only on cron-job.org)
      - name: Find the cron jobs to remove
        id: cron-folders
        if: ${{ !cancelled() }}
        env:
          PR: ${{ needs.decide.outputs.pr }}
          KEEP: ${{ needs.decide.outputs.keep }}
        run: |
          folders=""
          exclude=""
          if [[ -n "$PR" ]]; then
            folders="${cron_folder_prefix}${PR}"
          else
            folders="${cron_folder_prefix}*"
            if [[ -n "$KEEP" ]]; then
              exclude="$(tr ' ' '\n' <<< "$KEEP" | sed "/^\$/d; s/^/${cron_folder_prefix}/")"
            fi
          fi

          {
            echo "folders=${folders}"
            echo "exclude<<EOF_EXCLUDE"
            echo "$exclude"
            echo "EOF_EXCLUDE"
          } >> "$GITHUB_OUTPUT"

      - name: Remove the cron jobs of the previews
        if: ${{ !cancelled() && steps.cron-folders.outputs.folders != '' }}
        uses: LukeSavefrogs/cron-job-org-action@v2
        with:
          api-key: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          command: delete
          folder: ${{ steps.cron-folders.outputs.folders }}
          exclude: ${{ steps.cron-folders.outputs.exclude }}

      # Also after a manual teardown or a cleanup, which know only the numbers of the PRs: the deployments are recorded
      # under the branch of the PR, which GitHub still returns once the PR is merged or its branch deleted
      - name: Mark the deployments of the removed previews as inactive
        if: ${{ !cancelled() && steps.remove.outputs.prs != '' }}
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PRS: ${{ steps.remove.outputs.prs }}
        with:
          script: |
            const numbers = process.env.PRS.split(' ').filter(Boolean).map(Number);

            for (const number of numbers) {
              try {
                const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
                const deployments = await github.paginate(github.rest.repos.listDeployments, {
                  ...context.repo,
                  environment: 'PREVIEW',
                  ref: pr.head.ref,
                });

                for (const deployment of deployments) {
                  await github.rest.repos.createDeploymentStatus({
                    ...context.repo,
                    deployment_id: deployment.id,
                    state: 'inactive',
                  });
                }

                core.info(`PR #${number}: ${deployments.length} deployment(s) marked as inactive.`);
              } catch (error) {
                core.warning(`PR #${number}: could not mark its deployments as inactive (${error.message}).`);
              }
            }

      - name: Comment on the PR (removed)
        if: steps.remove.outputs.pr != ''
        uses: ./.github/actions/preview-comment
        with:
          pr: ${{ steps.remove.outputs.pr }}
          status: removed
