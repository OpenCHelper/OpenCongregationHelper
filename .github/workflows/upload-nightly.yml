name: Upload to Altervista (TEST environment)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manually trigger a workflow run

# Limit the number of concurrent jobs to prevent overloading the server
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Recreate Altervista PHP environment (using the `phpinfo()` output)
env:
  node_version: '20.x'
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib

jobs:
  upload:
    name: Upload to Altervista
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y jq lftp

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: 'npm'

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          extensions: ${{ env.php_extensions }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

      - name: Install NodeJS dependencies
        run: npm ci
      
      - name: Run build
        run: |
          npm run build --if-present && rm -rf node_modules
          php artisan filament:asset
          php artisan vendor:publish --tag=filament-assets --force

      - name: Create git detail files
        run: |
          echo "${{ github.sha }}" > .git-commit-hash
          echo "ref: ${{ github.ref }}" > .git-branch-name

      - name: FTP Deploy (application)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.FTP_SERVER_TEST }}
          username: ${{ secrets.FTP_USERNAME_TEST }}
          password: ${{ secrets.FTP_PASSWORD_TEST }}
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state__application.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .vscode/
            !.git-commit-hash
            !.git-branch-name

            *.env
            .env*

            .gitignore
            docker-compose.yml
            Dockerfile
            *.sql

            vendor
            vendor/**
            **/node_modules/**

      # Separate FTP deploy so that if it fails, the application is still deployed
      # and the vendor folder can be deployed later.
      - name: FTP Deploy (vendor)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.FTP_SERVER_TEST }}
          username: ${{ secrets.FTP_USERNAME_TEST }}
          password: ${{ secrets.FTP_PASSWORD_TEST }}
          local-dir: ./vendor/
          server-dir: ./vendor/
          state-name: ../.ftp-deploy-sync-state__vendor.json
          log-level: verbose
          timeout: 120000
                  
      - name: Run Artisan commands
        id: run-artisan
        env:
          FTP_SERVER_URL: ${{ secrets.FTP_SERVER_TEST }}
        run: |
          set -e
          set -o pipefail
          set -o nounset

          export ARTISAN_BASE_URL="https://artisan.${FTP_SERVER_URL##ftp.}";
          export ARTISAN_COMMANDS_LOG="/tmp/artisan-commands-output.txt"

          [[ ! -x "scripts/remote_artisan.sh" ]] && chmod +x scripts/remote_artisan.sh

          function remote_artisan () {
            if [[ "$1" == "--" ]]; then
              echo "\$ ${*:2}" >> "${ARTISAN_COMMANDS_LOG:-/dev/null}"
            else
              echo "\$ $*" >> "${ARTISAN_COMMANDS_LOG:-/dev/null}"
            fi
            scripts/remote_artisan.sh                                 \
              --base-url "$ARTISAN_BASE_URL"                          \
              --ftp-hostname "${{ secrets.FTP_SERVER_TEST }}"         \
              --ftp-username "${{ secrets.FTP_USERNAME_TEST }}"       \
              --ftp-password "${{ secrets.FTP_PASSWORD_TEST }}"       \
              "$@" | tee -a "${ARTISAN_COMMANDS_LOG:-/dev/null}"
            echo "" >> "${ARTISAN_COMMANDS_LOG:-/dev/null}"
          }

          printf "Using Artisan base URL %s\n\n" "$ARTISAN_BASE_URL"

          # -------------------------     Clear Bootstrap Cache     -------------------------
          printf '\nClearing bootstrap cache contents...\n'
          lftp -c "set ftp:ssl-allow no; open -u ${{ secrets.FTP_USERNAME_TEST }},${{ secrets.FTP_PASSWORD_TEST }} ${{ secrets.FTP_SERVER_TEST }}; cd bootstrap/cache; glob -a --exist * && glob -a rm -rf *"
          printf '\n\n'

          # ------------------------- Test Artisan endpoint -------------------------
          printf "Test Artisan endpoint:\n"
          remote_artisan -- test-endpoint positional-arg --keyword-arg | sed 's/^/  | /'
          printf '\n\n'

          # ------------------------- Environment -------------------------
          printf "Current environment:\n"
          environment=$(remote_artisan -- config:show app.env --no-interaction --no-ansi)
          echo "$environment" | sed 's/^/  | /'

          printf '\n\n'

          # -------------------------     Clear Cache     -------------------------
          printf '\nClear optimizations...\n'
          remote_artisan -- optimize:clear --no-interaction --no-ansi | sed 's/^/  | /'
          
          # ------------------------- Migrations / Seeder -------------------------
          printf '\nRunning migrations...\n'
          remote_artisan -- migrate:fresh --seed --no-interaction --no-ansi | sed 's/^/  | /'
          
          printf '\nRunning fake data seeders...\n'
          remote_artisan -- db:seed --class=FakeDataSeeder --no-interaction --no-ansi | sed 's/^/  | /'

          printf '\nSetting Super Admin user...\n'
          remote_artisan -- shield:super-admin --user=1 --panel=app --no-interaction --no-ansi | sed 's/^/  | /'
        
          printf '\n\n'

          # ------------------------- Optimizations -------------------------
          printf '\nOptimizing the application...\n'

          commands=(
            # First clear all previous optimizations
            optimize:clear
            filament:clear-cached-components
            filament:optimize-clear

            # Now cache individually the configuration, routes, and views (instead of `optimize`, which does all but does not show anything)
            config:cache
            event:cache
            route:cache
            view:cache

            # Optimize Filament assets
            filament:cache-components
            filament:optimize
          )
          for command in "${commands[@]}"; do
            printf ">>> $ artisan %s\n" "$command"
            remote_artisan -- "$command" --no-interaction --no-ansi | sed 's/^/  | /'
            printf '\n'
          done

          echo "Artisan commands execution completed. Output logged to ${ARTISAN_COMMANDS_LOG}."
          # Set the step output to the log file path so it can be used in the summary
          echo "artisan_logfile=${ARTISAN_COMMANDS_LOG}" >> "$GITHUB_OUTPUT"
          echo "artisan_url=${ARTISAN_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "app_environment=$(echo "$environment" | sed -r 's/^.*?\.+//; s/^\s*//; s/\s*$//; /^\s*$/d')" >> "$GITHUB_OUTPUT"

      - name: Set summary
        env:
          ARTISAN_LOG_FILE: ${{ steps.run-artisan.outputs.artisan_logfile }}
          ARTISAN_BASE_URL: ${{ steps.run-artisan.outputs.artisan_url }}
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## Deployment Summary
          - **Commit**: \`${{ github.sha }}\`
          - **Branch**: \`${{ github.ref }}\`
          - **Environment**: \`${{ steps.run-artisan.outputs.app_environment }}\`

          ### Artisan Commands Execution
          - **Base URL**: \`${ARTISAN_BASE_URL}\`
          - **Log**: [View Output]($ARTISAN_LOG_FILE)
          \`\`\`plaintext
          $(cat "$ARTISAN_LOG_FILE")
          \`\`\`
          EOF
