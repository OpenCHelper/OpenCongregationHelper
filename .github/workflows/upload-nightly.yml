name: Upload to Altervista (TEST environment)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manually trigger a workflow run

permissions:
  contents: read

# Limit the number of concurrent jobs to prevent overloading the server
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload:
    uses: ./.github/workflows/upload-altervista-reusable.yml
    with:
      label: TEST
      reset-database: true
      seed-dummy-data: true
      setup-root-user: true
      install-dev-dependencies: true
    secrets:
      ftp_server: ${{ secrets.FTP_SERVER_TEST }}
      ftp_username: ${{ secrets.FTP_USERNAME_TEST }}
      ftp_password: ${{ secrets.FTP_PASSWORD_TEST }}
