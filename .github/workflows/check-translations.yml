name: Check Translations

on:
  push:
  workflow_dispatch: # Manually trigger a workflow run

jobs:
  check-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check translations (application)
        run: php artisan translations:check --excludedDirectories=vendor --excludedFileExtensions=json

      - name: Check translations (vendor)
        continue-on-error: true
        run: |
            set -o pipefail

            declare -A translation_errors=()
            while read -ru3 -d $'\0' dir; do
              echo "Checking translations in $dir..."
              if ! _output="$(php artisan translations:check --excludedDirectories=.gitkeep --excludedFileExtensions=json --directory="$dir" 2>&1)"; then
                translation_errors["$dir"]="$_output"
              fi
              sed 's/^/  | /' <<< "$_output"
            done 3< <(find lang/vendor -mindepth 1 -maxdepth 1 -type d -print0)

            # Print warnings
            for dir in "${!translation_errors[@]}"; do
              while read -r error; do
                [[ -z "$error" ]] && continue

                echo "::warning file=$dir::$error"
              done <<< "${translation_errors[$dir]}"
            done

      - name: Translation check summary
        run: echo "✅ All translation keys are properly defined and consistent across locales!"
