name: Check Translations

on:
  push:
  workflow_dispatch: # Manually trigger a workflow run

env:
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib

jobs:
  check-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          extensions: ${{ env.php_extensions }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

      - name: Check translations (application)
        run: php artisan translations:check --excludedDirectories=vendor

      - name: Check translations (vendor)
        continue-on-error: true
        run: |
            set -o pipefail

            declare -A translation_errors=()
            while read -ru3 -d $'\0' dir; do
              echo "Checking translations in $dir..."
              if ! _output="$(php artisan translations:check --excludedDirectories=.gitkeep --excludedFileExtensions=json --directory="$dir" 2>&1)"; then
                translation_errors["$dir"]="$_output"
              fi
              sed 's/^/  | /' <<< "$_output"
            done 3< <(find lang/vendor -mindepth 1 -maxdepth 1 -type d -print0)

            # Print warnings
            for dir in "${!translation_errors[@]}"; do
              while read -r error; do
                [[ -z "$error" ]] && continue

                echo "::warning file=$dir::$error"
              done <<< "${translation_errors[$dir]}"
            done

      - name: Translation check summary
        run: echo "✅ All translation keys are properly defined and consistent across locales!"
