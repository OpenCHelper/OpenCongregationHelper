name: Run linter

on:
  push:
  # Pull requests from forks only: those of this repository are already checked on push
  pull_request:
  workflow_dispatch: # Manually trigger a workflow run
  workflow_call:

permissions:
  contents: read

env:
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib

# FilaCheck, Pint and PHPStan only analyse the source code: they need neither
# the application environment nor the Sail containers.
jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          extensions: ${{ env.php_extensions }}
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --no-scripts --optimize-autoloader

      - name: Run filacheck
        run: |
          ./vendor/bin/filacheck

      - name: Run pint
        run: |
          ./vendor/bin/pint --test

      - name: Run phpstan
        run: |
          ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github
