name: Claude Code

# Runs Claude Code when `@claude` is mentioned in an issue (title or body), an issue or pull request comment, or a pull
# request review: it answers, or works on the request and opens a pull request. Only users with write access to the
# repository can trigger it. It acts as the Claude GitHub App, which must be installed on the repository.
#
# Secrets (Settings → Secrets and variables → Actions), one of:
#   - ANTHROPIC_API_KEY: an API key of the Anthropic Console (usage billed to its account);
#   - CLAUDE_CODE_OAUTH_TOKEN: a token of a Claude subscription, from `claude setup-token` (usage counted on it).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

#
# Optional repository variable CLAUDE_ALLOWED_USERS: GitHub usernames allowed to call Claude, separated by commas
# without spaces (e.g. `opencongregationhelper-bot,alice`). Empty: every user with write access to the repository.
jobs:
  claude:
    if: |
      (
        vars.CLAUDE_ALLOWED_USERS == '' ||
        contains(format(',{0},', vars.CLAUDE_ALLOWED_USERS), format(',{0},', github.actor))
      ) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
