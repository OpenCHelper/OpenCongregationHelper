name: Upload to Altervista (Reusable)

# The FTP credentials come from the GitHub environment given as input (e.g. NIGHTLY, UAT): the `FTP_SERVER` and
# `FTP_USERNAME` variables (or secrets, but GitHub then hides the URL of the site, which contains them) and the
# `FTP_PASSWORD` secret. The callers must pass `secrets: inherit`, otherwise the secrets resolve to empty strings.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment holding the FTP credentials of the space (e.g. NIGHTLY, UAT)"
        required: true
        type: string
      label:
        description: Human-friendly target environment label shown in the job summary.
        required: false
        default: "unknown"
        type: string
      install-dev-dependencies:
        description: Install Composer devevelopment dependencies.
        required: false
        default: false
        type: boolean
      reset-database:
        description: Discard any existing data in the database during the migration.
        required: false
        default: false
        type: boolean
      seed-dummy-data:
        description: Seed dummy data into the database.
        required: false
        default: false
        type: boolean
      setup-root-user:
        description: "Run `shield:super-admin` for user with ID=1 on the `app` panel."
        required: false
        default: false
        type: boolean
      delete-remote-contents:
        description: "Delete the contents of the remote folder before starting the upload via FTP"
        required: false
        default: false
        type: boolean
      verbose:
        description: "Increase the overall verbosity of the logging"
        required: false
        default: false
        type: boolean
      environment-folder:
        description: >-
          Folder of the environment in a space hosting several of them (e.g. `test`, see the README): the release is
          uploaded as a single archive and unpacked on the server, keeping `.env`, `storage/app` and `storage/logs`.
          Empty for an application installed in the root of its space, synchronized file by file.
        required: false
        default: ""
        type: string
      repository:
        description: >-
          Repository to deploy (`owner/name`), e.g. when called from another repository to deploy a release of this
          one. Empty for the repository of the caller.
        required: false
        default: ""
        type: string
      ref:
        description: Tag, branch or commit to deploy. Empty for the one that triggered the caller.
        required: false
        default: ""
        type: string
      dotenv:
        description: >-
          Contents of the `.env` file written by the build and deployed with the release, instead of the one managed
          on the server (archive deployments only, see `environment-folder`), e.g. for a demo. A new `APP_KEY` is
          added on every deployment, and the `DB_PASSWORD` and `ROOT_PASSWORD` secrets of the environment, when set,
          as `DB_PASSWORD` and `INITIAL_ROOT_PASSWORD`. Empty to keep the `.env` file of the server.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  node_version: "20.x"

jobs:
  upload:
    name: Upload to Altervista (${{ inputs.label }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Get Artisan required data
        id: artisan-required-data
        env:
          FTP_SERVER_URL: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Secrets missing from the environment (or not inherited by the caller) are empty strings, not errors
          if [[ -z "$FTP_SERVER_URL" ]] || [[ -z "$FTP_USERNAME" ]] || [[ -z "$FTP_PASSWORD" ]]; then
            echo "::error::Set the FTP_SERVER and FTP_USERNAME variables and the FTP_PASSWORD secret of the ${ENVIRONMENT} environment (and pass \`secrets: inherit\` to this workflow)."
            exit 1
          fi

          echo "artisan-base-url=https://${FTP_SERVER_URL##ftp.}" >> "$GITHUB_OUTPUT"
          echo "artisan-log-file=/tmp/artisan-commands-output.txt" >> "$GITHUB_OUTPUT"

      - name: Build application
        uses: ./.github/actions/build-application
        with:
          install-dev-dependencies: ${{ inputs.install-dev-dependencies }}
          node-version: ${{ env.node_version }}

      # From the code checked out, which may not be the one of the caller (see the `ref` input)
      - name: Create git detail files
        env:
          REF: ${{ inputs.ref }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          git rev-parse HEAD > .git-commit-hash

          if [[ -z "$REF" ]]; then
            echo "ref: ${TRIGGER_REF}" > .git-branch-name
          elif git show-ref --verify --quiet "refs/tags/${REF}"; then
            echo "ref: refs/tags/${REF}" > .git-branch-name
          else
            echo "ref: refs/heads/${REF}" > .git-branch-name
          fi

      # Only with the `dotenv` input: the `.env` file of the release, with a new application key on every deployment
      - name: Write the .env file
        if: inputs.dotenv != ''
        env:
          DOTENV: ${{ inputs.dotenv }}
          ENVIRONMENT_FOLDER: ${{ inputs.environment-folder }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          if [[ -z "$ENVIRONMENT_FOLDER" ]]; then
            echo "::error::The dotenv input needs an archive deployment: set the environment-folder input too."
            exit 1
          fi

          # Values are single-quoted, so that they are read literally (no `${...}` interpolation)
          for name in DB_PASSWORD ROOT_PASSWORD; do
            if [[ "${!name}" == *"'"* ]]; then
              echo "::error::The ${name} secret cannot contain single quotes."
              exit 1
            fi
          done

          {
            printf '%s\n' "$DOTENV"
            echo "APP_KEY='$(php artisan key:generate --show --no-ansi)'"
            if [[ -n "$DB_PASSWORD" ]]; then
              echo "DB_PASSWORD='${DB_PASSWORD}'"
            fi
            if [[ -n "$ROOT_PASSWORD" ]]; then
              echo "INITIAL_ROOT_PASSWORD='${ROOT_PASSWORD}'"
            fi
          } > .env

          echo "Written the .env file with the settings: $(sed -n 's/^\([A-Z_]*\)=.*/\1/p' .env | sort -u | paste -sd ' ')"

      # The files never deployed (`.git-ftp-ignore`, also read by the archive deployments), as FTP-Deploy globs
      - name: Read the files never deployed
        id: never-deployed
        if: inputs.environment-folder == ''
        run: |
          {
            echo "app<<EOF_NEVER_DEPLOYED"
            scripts/git_ftp_ignore_globs.sh .git-ftp-ignore app
            echo "EOF_NEVER_DEPLOYED"
            echo "vendor<<EOF_NEVER_DEPLOYED"
            scripts/git_ftp_ignore_globs.sh .git-ftp-ignore vendor
            echo "EOF_NEVER_DEPLOYED"
          } >> "$GITHUB_OUTPUT"

      - name: FTP Deploy (application)
        if: inputs.environment-folder == ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        timeout-minutes: 150 # Max 2-5 hours
        with:
          protocol: ftp
          server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state__application.json
          log-level: ${{ inputs.verbose && 'verbose' || 'minimal' }}
          timeout: 0 # disable timeout at the action level, use the one at step level
          exclude: |
            **/.git*
            **/.git*/**
            .vscode/**
            !.git-commit-hash
            !.git-branch-name

            *.env
            .env*

            .gitignore
            docker-compose.yml
            Dockerfile
            *.sql

            vendor
            vendor/**
            **/node_modules/**
            ${{ steps.never-deployed.outputs.app }}

      # Separate FTP deploy so that if it fails, the application is still deployed
      # and the vendor folder can be deployed later.
      - name: FTP Deploy (vendor)
        if: inputs.environment-folder == ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        timeout-minutes: 300 # Max 5 hours
        with:
          protocol: ftp
          server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./vendor/
          server-dir: ./vendor/
          state-name: ../.ftp-deploy-sync-state__vendor.json
          log-level: ${{ inputs.verbose && 'verbose' || 'minimal' }}
          timeout: 0
          dangerous-clean-slate: ${{ inputs.delete-remote-contents }}
          # FTP-Deploy's default exclusions, plus the tests and documentation of the packages
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            ${{ steps.never-deployed.outputs.vendor }}

      # The router of the space is shared by every workflow deploying to it (e.g. the PR previews): its settings come
      # from repository variables, so that they all write the same one
      - name: Check the settings of the space
        if: inputs.environment-folder != ''
        env:
          SPACE_DEFAULT_ENVIRONMENT: ${{ vars.SPACE_DEFAULT_ENVIRONMENT }}
          SPACE_PHP_HANDLER: ${{ vars.SPACE_PHP_HANDLER }}
        run: |
          if [[ -z "$SPACE_DEFAULT_ENVIRONMENT" ]] || [[ -z "$SPACE_PHP_HANDLER" ]]; then
            echo "::error::Set the SPACE_DEFAULT_ENVIRONMENT (e.g. test) and SPACE_PHP_HANDLER (e.g. av-php82) repository variables: see the README."
            exit 1
          fi

      # Instead of synchronizing ~20k files one by one (hours), upload a single archive (minutes), unpacked on the
      # server and swapped with the live release at once
      - name: Deploy as a single archive
        if: inputs.environment-folder != ''
        timeout-minutes: 60
        uses: ./.github/actions/ftp-archive-deploy
        with:
          ftp-server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          target: ${{ inputs.environment-folder }}
          # The router of the space (e.g. `<site>` to `test/`, `pr-<N>.<site>` to `previews/`)
          manage-router: true
          default-environment: ${{ vars.SPACE_DEFAULT_ENVIRONMENT }}
          php-handler: ${{ vars.SPACE_PHP_HANDLER }}
          # `.env` is managed on the server (unless written by the build, see the `dotenv` input), and the files of the
          # environment survive its releases
          keep: |
            ${{ inputs.dotenv == '' && '.env' || '' }}
            storage/app
            storage/logs
          # A release that changes no Composer package uploads only the autoloader of `vendor/`
          reuse-vendor: true

      - name: Clear cache
        if: inputs.environment-folder == ''
        uses: ./.github/actions/altervista-clear-cache-action
        with:
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}

      - name: Find remote environment
        id: remote-env-raw
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          token-file: ${{ inputs.environment-folder != '' && format('{0}/', inputs.environment-folder) || '' }}storage/framework/.artisan-token
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          commands: "config:show app.env"
          verbose: true

      - name: "Parse raw artisan response (config:show app.env)"
        id: parse-environment
        env:
          RAW_ENVIRONMENT: ${{ steps.remote-env-raw.outputs.output }}
        run: |
          echo "Parsing the remote app environment into a usable format."
          echo "ORIGINAL:"
          sed 's/^/\t | /' <<< "$RAW_ENVIRONMENT"

          parsed_environment="$(sed -r '1d; s/^.*?\.+//; s/^\s*//; s/\s*$//; /^\s*$/d' <<< "$RAW_ENVIRONMENT")"
          echo "PARSED:"
          sed 's/^/\t | /' <<< "$parsed_environment"

          echo "app_environment=$parsed_environment" >> "$GITHUB_OUTPUT"

      - name: Run Artisan commands
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          token-file: ${{ inputs.environment-folder != '' && format('{0}/', inputs.environment-folder) || '' }}storage/framework/.artisan-token
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          commands: |
            # ------------------------- Test Artisan endpoint -------------------------
            php artisan test-endpoint positional-arg --keyword-arg

            # ------------------------- Environment -------------------------
            php artisan config:show app.env

            # -------------------------     Clear Cache     -------------------------
            # Except the cache store, whose table may not exist before migrating (e.g. after changing `DB_PREFIX`):
            # it is cleared after the migrations
            php artisan optimize:clear --except=cache

      # `storage:link --force` replaces a link, not a folder: the file sync of PRE-PRODUCTION used to upload the build's
      # link as a plain folder. It is removed only when it holds nothing but the `.gitignore` of that copy, and never
      # recursively. Some FTP servers list a link as a folder: a probe file put in `storage/app/public` shows up in
      # `public/storage` only when it is the link, which is then left alone
      - name: Replace the public/storage folder with the link
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FOLDER: ${{ inputs.environment-folder != '' && format('{0}/', inputs.environment-folder) || '' }}
        run: |
          command -v lftp > /dev/null || { sudo apt-get update && sudo apt-get install -y lftp; }

          ftp () {
            LFTP_PASSWORD="$FTP_PASSWORD" lftp --norc \
              -e 'set ssl:check-hostname no; set net:max-retries 3; set net:reconnect-interval-base 5' \
              -u "$FTP_USERNAME" --env-password "$FTP_SERVER"
          }

          link="${FOLDER}public/storage"
          target="${FOLDER}storage/app/public"

          # `/` after a folder (or a link listed as one), `@` after a link, nothing when it does not exist
          if [[ "$(ftp <<< "cls -d -F '${link}'" 2> /dev/null || true)" != */ ]]; then
            echo "${link} is not a folder: storage:link creates (or recreates) the link."
            exit 0
          fi

          probe=".storage-link-probe-${GITHUB_RUN_ID:-$$}"
          probe_file="$(mktemp)"
          listing="$(ftp <<< "put '${probe_file}' -o '${target}/${probe}'; cls -1 -a -B '${link}/'; rm -f '${target}/${probe}'" 2> /dev/null || true)"
          rm -f "$probe_file"

          if grep -qxF "$probe" <<< "$listing"; then
            echo "${link} is already the link (listed as a folder by the server): storage:link recreates it."
            exit 0
          fi

          if grep -qvxE '(\.gitignore|\.|\.\.)?' <<< "$listing"; then
            echo "::warning::${link} is a folder holding other files: move them into ${target} and delete it, so that storage:link can create the link."
            exit 0
          fi

          ftp <<< "rm -f '${link}/.gitignore'; rmdir '${link}'"
          echo "Removed the ${link} folder (a copy of the build's link): storage:link creates the link."

      - name: Run Artisan commands
        id: run-artisan
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          token-file: ${{ inputs.environment-folder != '' && format('{0}/', inputs.environment-folder) || '' }}storage/framework/.artisan-token
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          commands: |
            # ------------------------- Migrations / Seeder -------------------------
            artisan ${{ inputs.reset-database && 'migrate:fresh' || 'migrate' }} --seed

            ${{ inputs.seed-dummy-data && 'artisan db:seed --class=FakeDataSeeder' || '' }}
            ${{ inputs.setup-root-user && 'artisan shield:super-admin --user=1 --panel=app' || '' }}

            # The `public/storage` link is never deployed (the build's one would be uploaded as a plain folder)
            artisan storage:link --force

            # ------------------------- Optimizations -------------------------
            # First clear all previous optimizations
            artisan optimize:clear
            artisan filament:clear-cached-components
            artisan filament:optimize-clear

            # Now cache individually the configuration, routes, and views (instead of `optimize`, which does all but does not show anything)
            artisan config:cache
            artisan event:cache
            artisan route:cache
            artisan view:cache

            # Optimize Filament assets
            artisan filament:cache-components
            artisan filament:optimize

            # Interrupt sub-minute tasks (if any) - https://laravel.com/docs/12.x/scheduling#interrupting-sub-minute-tasks
            artisan schedule:interrupt

      - name: Set summary
        env:
          ARTISAN_LOG_FILE: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          ARTISAN_BASE_URL: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
        run: |
          declare -r github_sha_hash="$(git rev-parse HEAD)"
          declare -r github_sha_short="${github_sha_hash:0:7}"
          declare -r deployed_ref="$(sed 's|^ref: refs/[a-z]*/||' .git-branch-name)"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Deployment Summary

          ### Deployment details
          - **Commit**: \`${github_sha_short}\` (\`${github_sha_hash}\`)
          - **Branch**: \`${deployed_ref}\`
          - **Target**: \`${{ inputs.label }}\`
          - **Environment**: \`${{ steps.parse-environment.outputs.app_environment }}\`

          ### Artisan Commands Execution
          - **Base URL**: \`${ARTISAN_BASE_URL}\`

          <details>
          <summary>View full Artisan output</summary>

            \`\`\`plaintext
          $(cat "$ARTISAN_LOG_FILE" | sed 's/^/  /')
            \`\`\`

          </details>
          EOF
