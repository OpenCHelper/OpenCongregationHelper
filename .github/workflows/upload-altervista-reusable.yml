name: Upload to Altervista (Reusable)

on:
  workflow_call:
    inputs:
      label:
        description: Human-friendly target environment label shown in the job summary.
        required: false
        default: "unknown"
        type: string
      install-dev-dependencies:
        description: Install Composer devevelopment dependencies.
        required: false
        default: false
        type: boolean
      reset-database:
        description: Discard any existing data in the database during the migration.
        required: false
        default: false
        type: boolean
      seed-dummy-data:
        description: Seed dummy data into the database.
        required: false
        default: false
        type: boolean
      setup-root-user:
        description: "Run `shield:super-admin` for user with ID=1 on the `app` panel."
        required: false
        default: false
        type: boolean
    secrets:
      ftp_server:
        required: true
      ftp_username:
        required: true
      ftp_password:
        required: true

permissions:
  contents: read

# Recreate Altervista PHP environment (using the `phpinfo()` output)
env:
  node_version: "20.x"
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib

jobs:
  upload:
    name: Upload to Altervista (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Artisan required data
        id: artisan-required-data
        env:
          FTP_SERVER_URL: ${{ secrets.ftp_server }}
        run: |
          echo "artisan-base-url=https://artisan.${FTP_SERVER_URL##ftp.}" >> "$GITHUB_OUTPUT"
          echo "artisan-log-file=/tmp/artisan-commands-output.txt" >> "$GITHUB_OUTPUT"

      - name: Install packages
        run: |
          curl --version && curl --help all
          
          sudo apt-get update \
            && sudo apt-get install -y jq lftp

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: npm

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          extensions: ${{ env.php_extensions }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Install Composer dependencies
        run: |
          composer_args=(
            --no-ansi
            --no-interaction
            --no-plugins
            --no-progress
            --no-scripts
            --optimize-autoloader
          )

          if [[ '${{ inputs.install-dev-dependencies }}' == 'false' ]]; then
            composer_args+=(--no-dev)
          fi

          composer install "${composer_args[@]}"

      - name: Install NodeJS dependencies
        run: npm ci

      - name: Run build
        run: |
          npm run build --if-present && rm -rf node_modules
          php artisan filament:asset
          php artisan vendor:publish --tag=filament-assets --force

      - name: Create git detail files
        run: |
          echo "${{ github.sha }}" > .git-commit-hash
          echo "ref: ${{ github.ref }}" > .git-branch-name

      - name: FTP Deploy (application)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state__application.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .vscode/
            !.git-commit-hash
            !.git-branch-name

            *.env
            .env*

            .gitignore
            docker-compose.yml
            Dockerfile
            *.sql

            vendor
            vendor/**
            **/node_modules/**

      # Separate FTP deploy so that if it fails, the application is still deployed
      # and the vendor folder can be deployed later.
      - name: FTP Deploy (vendor)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: ./vendor/
          server-dir: ./vendor/
          state-name: ../.ftp-deploy-sync-state__vendor.json
          log-level: verbose
          timeout: 120000

      - name: Clear cache
        uses: ./.github/actions/altervista-clear-cache-action
        with:
          ftp-hostname: ${{ secrets.ftp_server }}
          ftp-username: ${{ secrets.ftp_username }}
          ftp-password: ${{ secrets.ftp_password }}

      - name: Find remote environment
        id: remote-env-raw
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ secrets.ftp_server }}
          ftp-username: ${{ secrets.ftp_username }}
          ftp-password: ${{ secrets.ftp_password }}
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          commands: "config:show app.env"
          verbose: true

      - name: "Parse raw artisan response (config:show app.env)"
        id: parse-environment
        env:
          RAW_ENVIRONMENT: ${{ steps.remote-env-raw.outputs.output }}
        run: |
          echo "Parsing the remote app environment into a usable format."
          echo "ORIGINAL:"
          sed 's/^/\t | /' <<< "$RAW_ENVIRONMENT"

          parsed_environment="$(sed -r 's/^.*?\.+//; s/^\s*//; s/\s*$//; /^\s*$/d' <<< "$RAW_ENVIRONMENT")"
          echo "PARSED:"
          sed 's/^/\t | /' <<< "$parsed_environment"

          echo "app_environment=$parsed_environment" >> "$GITHUB_OUTPUT"

      - name: Run Artisan commands
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ secrets.ftp_server }}
          ftp-username: ${{ secrets.ftp_username }}
          ftp-password: ${{ secrets.ftp_password }}
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          verbose: true
          commands: |
            # ------------------------- Test Artisan endpoint -------------------------
            php artisan test-endpoint positional-arg --keyword-arg

            # ------------------------- Environment -------------------------
            php artisan config:show app.env

            # -------------------------     Clear Cache     -------------------------
            php artisan optimize:clear

      - name: Run Artisan commands
        id: run-artisan
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ secrets.ftp_server }}
          ftp-username: ${{ secrets.ftp_username }}
          ftp-password: ${{ secrets.ftp_password }}
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          verbose: true
          commands: |
            # ------------------------- Migrations / Seeder -------------------------
            artisan ${{ case(inputs.reset-database == 'false', 'migrate', 'migrate:fresh') }} --seed

            ${{ inputs.seed-dummy-data == 'false' && '# ' }} artisan db:seed --class=FakeDataSeeder
            ${{ inputs.setup-root-user == 'false' && '# ' }} artisan shield:super-admin --user=1 --panel=app

            # ------------------------- Optimizations -------------------------
            # First clear all previous optimizations
            artisan optimize:clear
            artisan filament:clear-cached-components
            artisan filament:optimize-clear

            # Now cache individually the configuration, routes, and views (instead of `optimize`, which does all but does not show anything)
            artisan config:cache
            artisan event:cache
            artisan route:cache
            artisan view:cache

            # Optimize Filament assets
            artisan filament:cache-components
            artisan filament:optimize

      - name: Set summary
        env:
          ARTISAN_LOG_FILE: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          ARTISAN_BASE_URL: ${{ steps.run-artisan.outputs.artisan_url }}
        run: |
          declare -r github_sha_hash=${{ github.sha }}
          declare -r github_sha_short="${github_sha_hash:0:7}"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Deployment Summary

          ### Deployment details
          - **Commit**: \`${github_sha_short}\` (\`${github_sha_hash}\`)
          - **Branch**: \`${{ github.ref_name }}\`
          - **Target**: \`${{ inputs.label }}\`
          - **Environment**: \`${{ steps.parse-environment.outputs.app_environment }}\`

          ### Artisan Commands Execution
          - **Base URL**: \`${ARTISAN_BASE_URL}\`

          <details>
          <summary>View full Artisan output</summary>

          \`\`\`plaintext
          $(cat "$ARTISAN_LOG_FILE" | sed 's/^/  /')
          \`\`\`

          </details>
          EOF
