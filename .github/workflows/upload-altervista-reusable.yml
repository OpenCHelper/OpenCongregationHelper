name: Upload to Altervista (Reusable)

# The FTP credentials come from the GitHub environment given as input (e.g. NIGHTLY, UAT): the `FTP_SERVER` and
# `FTP_USERNAME` variables (or secrets, but GitHub then hides the URL of the site, which contains them) and the
# `FTP_PASSWORD` secret. The callers must pass `secrets: inherit`, otherwise the secrets resolve to empty strings.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment holding the FTP credentials of the space (e.g. NIGHTLY, UAT)"
        required: true
        type: string
      label:
        description: Human-friendly target environment label shown in the job summary.
        required: false
        default: "unknown"
        type: string
      install-dev-dependencies:
        description: Install Composer devevelopment dependencies.
        required: false
        default: false
        type: boolean
      reset-database:
        description: Discard any existing data in the database during the migration.
        required: false
        default: false
        type: boolean
      seed-dummy-data:
        description: Seed dummy data into the database.
        required: false
        default: false
        type: boolean
      setup-root-user:
        description: "Run `shield:super-admin` for user with ID=1 on the `app` panel."
        required: false
        default: false
        type: boolean
      delete-remote-contents:
        description: "Delete the contents of the remote folder before starting the upload via FTP"
        required: false
        default: false
        type: boolean
      verbose:
        description: "Increase the overall verbosity of the logging"
        required: false
        default: false
        type: boolean
      environment-folder:
        description: >-
          Folder of the environment in a space hosting several of them (e.g. `test`, see the README): the release is
          uploaded as a single archive and unpacked on the server, keeping `.env`, `storage/app` and `storage/logs`.
          Empty for an application installed in the root of its space, synchronized file by file.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  node_version: "20.x"

jobs:
  upload:
    name: Upload to Altervista (${{ inputs.label }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Artisan required data
        id: artisan-required-data
        env:
          FTP_SERVER_URL: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Secrets missing from the environment (or not inherited by the caller) are empty strings, not errors
          if [[ -z "$FTP_SERVER_URL" ]] || [[ -z "$FTP_USERNAME" ]] || [[ -z "$FTP_PASSWORD" ]]; then
            echo "::error::Set the FTP_SERVER and FTP_USERNAME variables and the FTP_PASSWORD secret of the ${ENVIRONMENT} environment (and pass \`secrets: inherit\` to this workflow)."
            exit 1
          fi

          echo "artisan-base-url=https://${FTP_SERVER_URL##ftp.}" >> "$GITHUB_OUTPUT"
          echo "artisan-log-file=/tmp/artisan-commands-output.txt" >> "$GITHUB_OUTPUT"

      - name: Build application
        uses: ./.github/actions/build-application
        with:
          install-dev-dependencies: ${{ inputs.install-dev-dependencies }}
          node-version: ${{ env.node_version }}

      - name: Create git detail files
        run: |
          echo "${{ github.sha }}" > .git-commit-hash
          echo "ref: ${{ github.ref }}" > .git-branch-name

      - name: FTP Deploy (application)
        if: inputs.environment-folder == ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        timeout-minutes: 150 # Max 2-5 hours
        with:
          protocol: ftp
          server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state__application.json
          log-level: ${{ inputs.verbose && 'verbose' || 'minimal' }}
          timeout: 0 # disable timeout at the action level, use the one at step level
          exclude: |
            **/.git*
            **/.git*/**
            .vscode/**
            !.git-commit-hash
            !.git-branch-name

            *.env
            .env*

            .gitignore
            docker-compose.yml
            Dockerfile
            *.sql

            vendor
            vendor/**
            **/node_modules/**

      # Separate FTP deploy so that if it fails, the application is still deployed
      # and the vendor folder can be deployed later.
      - name: FTP Deploy (vendor)
        if: inputs.environment-folder == ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        timeout-minutes: 300 # Max 5 hours
        with:
          protocol: ftp
          server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./vendor/
          server-dir: ./vendor/
          state-name: ../.ftp-deploy-sync-state__vendor.json
          log-level: ${{ inputs.verbose && 'verbose' || 'minimal' }}
          timeout: 0
          dangerous-clean-slate: ${{ inputs.delete-remote-contents }}

      # The router of the space is shared by every workflow deploying to it (e.g. the PR previews): its settings come
      # from repository variables, so that they all write the same one
      - name: Check the settings of the space
        if: inputs.environment-folder != ''
        env:
          SPACE_DEFAULT_ENVIRONMENT: ${{ vars.SPACE_DEFAULT_ENVIRONMENT }}
          SPACE_PHP_HANDLER: ${{ vars.SPACE_PHP_HANDLER }}
        run: |
          if [[ -z "$SPACE_DEFAULT_ENVIRONMENT" ]] || [[ -z "$SPACE_PHP_HANDLER" ]]; then
            echo "::error::Set the SPACE_DEFAULT_ENVIRONMENT (e.g. test) and SPACE_PHP_HANDLER (e.g. av-php82) repository variables: see the README."
            exit 1
          fi

      # Instead of synchronizing ~20k files one by one (hours), upload a single archive (minutes), unpacked on the
      # server and swapped with the live release at once
      - name: Deploy as a single archive
        if: inputs.environment-folder != ''
        timeout-minutes: 60
        uses: ./.github/actions/ftp-archive-deploy
        with:
          ftp-server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          target: ${{ inputs.environment-folder }}
          # The router of the space (e.g. `<site>` to `test/`, `pr-<N>.<site>` to `previews/`)
          manage-router: true
          default-environment: ${{ vars.SPACE_DEFAULT_ENVIRONMENT }}
          php-handler: ${{ vars.SPACE_PHP_HANDLER }}
          # `.env` is managed on the server, and the files of the environment survive its releases
          keep: |
            .env
            storage/app
            storage/logs

      - name: Clear cache
        if: inputs.environment-folder == ''
        uses: ./.github/actions/altervista-clear-cache-action
        with:
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}

      - name: Find remote environment
        id: remote-env-raw
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          token-file: ${{ inputs.environment-folder != '' && format('{0}/', inputs.environment-folder) || '' }}storage/framework/.artisan-token
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          commands: "config:show app.env"
          verbose: true

      - name: "Parse raw artisan response (config:show app.env)"
        id: parse-environment
        env:
          RAW_ENVIRONMENT: ${{ steps.remote-env-raw.outputs.output }}
        run: |
          echo "Parsing the remote app environment into a usable format."
          echo "ORIGINAL:"
          sed 's/^/\t | /' <<< "$RAW_ENVIRONMENT"

          parsed_environment="$(sed -r '1d; s/^.*?\.+//; s/^\s*//; s/\s*$//; /^\s*$/d' <<< "$RAW_ENVIRONMENT")"
          echo "PARSED:"
          sed 's/^/\t | /' <<< "$parsed_environment"

          echo "app_environment=$parsed_environment" >> "$GITHUB_OUTPUT"

      - name: Run Artisan commands
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          token-file: ${{ inputs.environment-folder != '' && format('{0}/', inputs.environment-folder) || '' }}storage/framework/.artisan-token
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          commands: |
            # ------------------------- Test Artisan endpoint -------------------------
            php artisan test-endpoint positional-arg --keyword-arg

            # ------------------------- Environment -------------------------
            php artisan config:show app.env

            # -------------------------     Clear Cache     -------------------------
            # Except the cache store, whose table may not exist before migrating (e.g. after changing `DB_PREFIX`):
            # it is cleared after the migrations
            php artisan optimize:clear --except=cache

      - name: Run Artisan commands
        id: run-artisan
        uses: ./.github/actions/altervista-artisan-action
        with:
          url: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
          ftp-hostname: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          ftp-username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          token-file: ${{ inputs.environment-folder != '' && format('{0}/', inputs.environment-folder) || '' }}storage/framework/.artisan-token
          log-file: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          commands: |
            # ------------------------- Migrations / Seeder -------------------------
            artisan ${{ inputs.reset-database && 'migrate:fresh' || 'migrate' }} --seed

            ${{ inputs.seed-dummy-data && 'artisan db:seed --class=FakeDataSeeder' || '' }}
            ${{ inputs.setup-root-user && 'artisan shield:super-admin --user=1 --panel=app' || '' }}

            # ------------------------- Optimizations -------------------------
            # First clear all previous optimizations
            artisan optimize:clear
            artisan filament:clear-cached-components
            artisan filament:optimize-clear

            # Now cache individually the configuration, routes, and views (instead of `optimize`, which does all but does not show anything)
            artisan config:cache
            artisan event:cache
            artisan route:cache
            artisan view:cache

            # Optimize Filament assets
            artisan filament:cache-components
            artisan filament:optimize

            # Interrupt sub-minute tasks (if any) - https://laravel.com/docs/12.x/scheduling#interrupting-sub-minute-tasks
            artisan schedule:interrupt

      - name: Set summary
        env:
          ARTISAN_LOG_FILE: ${{ steps.artisan-required-data.outputs.artisan-log-file }}
          ARTISAN_BASE_URL: ${{ steps.artisan-required-data.outputs.artisan-base-url }}
        run: |
          declare -r github_sha_hash=${{ github.sha }}
          declare -r github_sha_short="${github_sha_hash:0:7}"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Deployment Summary

          ### Deployment details
          - **Commit**: \`${github_sha_short}\` (\`${github_sha_hash}\`)
          - **Branch**: \`${{ github.ref_name }}\`
          - **Target**: \`${{ inputs.label }}\`
          - **Environment**: \`${{ steps.parse-environment.outputs.app_environment }}\`

          ### Artisan Commands Execution
          - **Base URL**: \`${ARTISAN_BASE_URL}\`

          <details>
          <summary>View full Artisan output</summary>

            \`\`\`plaintext
          $(cat "$ARTISAN_LOG_FILE" | sed 's/^/  /')
            \`\`\`

          </details>
          EOF
