name: Upload to Altervista (TEST environment)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+**'
  workflow_dispatch: # Manually trigger a workflow run

# Limit the number of concurrent jobs to prevent overloading the server
concurrency: 
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Recreate Altervista PHP environment (using the `phpinfo()` output)
env:
  node_version: '20.x'
  php_version: '8.2'
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib

jobs:
  upload:
    name: Upload to Altervista
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: 'npm'

      - name: Install NodeJS dependencies
        run: npm ci --omit=dev
      
      - name: Run build
        run: npm run build --if-present
      
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php_version }}
          extensions: ${{ env.php_extensions }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

      - name: Run optimizations
        run: |
          php artisan optimize

          # Clear configuration cache since it creates
          #    problems on Altervista (https://stackoverflow.com/a/72493970/8965861)
          php artisan config:clear
        
      - name: "FTP Deploy"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          protocol: ftp
          server: ${{ secrets.ftp_server_test }}
          username: ${{ secrets.ftp_username_test }}
          password: ${{ secrets.ftp_password_test }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .vscode/

            *.env
            .env*

            .gitignore
            docker-compose.yml
            Dockerfile
            *.sql