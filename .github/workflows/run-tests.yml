name: Run tests

on:
  push:
  workflow_dispatch: # Manually trigger a workflow run
  workflow_call:

env:
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          extensions: ${{ env.php_extensions }}
          coverage: xdebug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --no-scripts --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          set -e

          cp .env.example .env

          # Print environment variables for debugging
          echo "Environment variables:"
          sed 's/^/    | /' < .env

          php artisan key:generate --force

      - name: Build application
        run: |
          ./vendor/bin/sail up -d --build \
            && ./vendor/bin/sail npm install \
            && ./vendor/bin/sail npm run build

      # The MySQL container is reported as started (and its socket-based
      # healthcheck can already pass) while its init scripts still run on a
      # temporary server without networking: wait until it accepts TCP
      # connections, like the tests do, to avoid "Connection refused" errors.
      - name: Wait for MySQL
        run: |
          for attempt in $(seq 1 60); do
            if ./vendor/bin/sail exec -T mysql sh -c 'mysqladmin ping --silent --host=127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"' > /dev/null 2>&1; then
              echo "MySQL is accepting TCP connections (attempt ${attempt})."
              exit 0
            fi

            sleep 2
          done

          echo "::error::MySQL did not accept TCP connections within 120 seconds."
          ./vendor/bin/sail logs mysql
          exit 1

      - name: Run tests (with coverage)
        run: |
          ./vendor/bin/sail test --parallel --drop-databases --coverage

      - name: Stop application
        continue-on-error: true
        run: |
          ./vendor/bin/sail down -v --remove-orphans
