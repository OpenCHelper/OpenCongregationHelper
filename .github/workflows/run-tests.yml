name: Run tests

on:
  push:
  workflow_dispatch: # Manually trigger a workflow run
  workflow_call:

env:
  # Same major version installed in the Sail image (see docker-compose.yml)
  node_version: "24.x"
  php_extensions: >-
    bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
    ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
    ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
    ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
    ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib
  # Number of days after which the cached Sail image is rebuilt from scratch,
  # to pick up updates of its operating system packages, PHP and Node.js.
  sail_image_max_age_days: 7

jobs:
  run-tests:
    name: Run tests (prefixed=${{ matrix.db-prefix != '' && 'yes' || 'no' }})
    runs-on: ubuntu-latest

    # The PR previews share one database, prefixing their tables with `p<N>_` (`DB_PREFIX`): the suite also runs with
    # the longest prefix, to catch raw SQL missing the prefix and index names longer than the 64 characters of MySQL.
    strategy:
      fail-fast: false
      matrix:
        db-prefix: ["", "p9999_"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Tests run inside the Sail container (which has its own coverage
      # drivers): the runner's PHP only installs the dependencies.
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          extensions: ${{ env.php_extensions }}
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fail-fast: true

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --no-scripts --optimize-autoloader

      - name: Prepare Laravel environment
        env:
          DB_PREFIX: ${{ matrix.db-prefix }}
        run: |
          set -e

          cp .env.example .env

          if [[ -n "$DB_PREFIX" ]]; then
            sed -i "s/^DB_PREFIX=.*/DB_PREFIX=\"${DB_PREFIX}\"/" .env
          fi

          # Print environment variables for debugging
          echo "Environment variables:"
          sed 's/^/    | /' < .env

          php artisan key:generate --force

      # The assets are built on the runner, where the npm cache is restored by
      # `actions/setup-node`, and reach the container through the project
      # directory mount. They must be built after the Composer dependencies
      # are installed, since the Filament themes import CSS from `vendor`.
      - name: Install NodeJS dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      # The cache scope changes every `sail_image_max_age_days` days, so the
      # image is periodically rebuilt from scratch. Unused cache entries of the
      # previous scopes are deleted by GitHub after 7 days.
      - name: Prepare Sail image build
        id: sail-image
        run: |
          # Same group ID Sail would pass to the image build, so the image
          # built below matches the one `sail up --build` would produce.
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

          period_seconds=$(( sail_image_max_age_days * 86400 ))
          period_start=$(( $(date -u +%s) / period_seconds * period_seconds ))
          echo "cache-scope=sail-$(date -u -d "@${period_start}" +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the Sail image with Bake, which reads its build definition from
      # docker-compose.yml, storing its layers in the GitHub Actions cache:
      # subsequent runs reuse them instead of building the image from scratch.
      - name: Build Sail image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=${{ steps.sail-image.outputs.cache-scope }}
            *.cache-to=type=gha,scope=${{ steps.sail-image.outputs.cache-scope }},mode=max,ignore-error=true

      # On startup, the application container changes the ID of the `sail`
      # user to the runner's user ID, so that it can write to the project
      # directory mount: commands run through Sail before that fail with
      # "permission denied" errors.
      - name: Start application
        run: |
          ./vendor/bin/sail up -d

          for attempt in $(seq 1 30); do
            if [[ "$(./vendor/bin/sail exec -T laravel.test id -u sail 2> /dev/null)" == "$(id -u)" ]]; then
              echo "The application container is ready (attempt ${attempt})."
              exit 0
            fi

            sleep 1
          done

          echo "::error::The application container was not ready within 30 seconds."
          ./vendor/bin/sail logs laravel.test
          exit 1

      # The MySQL container is reported as started (and its socket-based
      # healthcheck can already pass) while its init scripts still run on a
      # temporary server without networking: wait until it accepts TCP
      # connections, like the tests do, to avoid "Connection refused" errors.
      - name: Wait for MySQL
        run: |
          for attempt in $(seq 1 60); do
            if ./vendor/bin/sail exec -T mysql sh -c 'mysqladmin ping --silent --host=127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"' > /dev/null 2>&1; then
              echo "MySQL is accepting TCP connections (attempt ${attempt})."
              exit 0
            fi

            sleep 2
          done

          echo "::error::MySQL did not accept TCP connections within 120 seconds."
          ./vendor/bin/sail logs mysql
          exit 1

      - name: Run tests${{ matrix.db-prefix == '' && ' (with coverage)' || '' }}
        run: |
          ./vendor/bin/sail test --parallel --drop-databases ${{ matrix.db-prefix == '' && '--coverage' || '' }}

      - name: Stop application
        continue-on-error: true
        run: |
          ./vendor/bin/sail down -v --remove-orphans
