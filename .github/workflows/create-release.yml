name: Create release

# Creates the GitHub release of every version tag that does not have one yet.
#
# GitHub does not trigger `push` workflows when more than three tags are pushed at once:
# after a bulk push (e.g. `git push --tags`) run this workflow manually to create the
# releases of all the tags still missing one.
#
# A manual run with `overwrite` also updates the existing releases (title, notes and
# pre-release flag) from the current CHANGELOG, e.g. after fixing the entries of a version:
# they are edited in place, so their URL, assets and publication date do not change.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**"
  workflow_dispatch: # Manually trigger a workflow run, to create the missing releases of all tags
    inputs:
      overwrite:
        description: Also update the existing releases (title, notes and pre-release flag), instead of skipping them
        type: boolean
        default: false

permissions:
  contents: write

# Never create the same release twice in parallel
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The CHANGELOG of every tag is needed

      - name: Create missing releases
        env:
          OVERWRITE: ${{ inputs.overwrite || false }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tags="$PUSHED_TAG"
          else
            # Oldest first, so the newest stable release ends up marked as "latest"
            tags=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=v:refname)
          fi

          for tag in $tags; do
            exists=false
            if gh release view "$tag" > /dev/null 2>&1; then
              if [ "$OVERWRITE" != "true" ]; then
                echo "::notice::Release $tag already exists, skipping"
                continue
              fi
              exists=true
            fi

            # Versions with a suffix (e.g. v1.0.0-alpha1) are pre-releases
            prerelease=false
            case "$tag" in *-*) prerelease=true ;; esac

            # Release notes: the CHANGELOG section of the version (plus the link
            # definitions it may reference), or the notes generated by GitHub.
            # The CHANGELOG of the default branch is the most up to date one
            # (e.g. fixed entries of past versions), the one of the tag is the fallback.
            version="${tag#v}"
            notes=""
            for source in "origin/$DEFAULT_BRANCH" "$tag"; do
              changelog=$(git show "$source:CHANGELOG.md" 2>/dev/null || true)
              notes=$(printf '%s\n' "$changelog" | awk -v version="$version" '
                index($0, "## [" version "]") == 1 || index($0, "## [v" version "]") == 1 { found = 1; next }
                found && /^## \[/ { exit }
                found { print }
              ')
              if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
                break
              fi
            done

            if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
              links=$(printf '%s\n' "$changelog" | grep -E '^\[[^]]+\]: ' || true)
              printf '%s\n\n%s\n' "$notes" "$links" > release-notes.md
            else
              echo "::warning::No CHANGELOG section found for $version, using the notes generated by GitHub"
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$tag" --jq '.body' > release-notes.md
            fi

            if [ "$exists" = "true" ]; then
              gh release edit "$tag" --title "$tag" --prerelease="$prerelease" --notes-file release-notes.md
              echo "::notice::Updated release $tag"
            else
              gh release create "$tag" --verify-tag --title "$tag" --prerelease="$prerelease" --notes-file release-notes.md
              echo "::notice::Created release $tag"
            fi
          done
