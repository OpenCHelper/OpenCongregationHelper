name: Upload to Altervista (PRE-PRODUCTION environment)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+**'
  workflow_dispatch: # Manually trigger a workflow run

permissions:
  contents: read

# Limit the number of concurrent jobs to prevent overloading the server
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload:
    uses: ./.github/workflows/upload-altervista-reusable.yml
    with:
      environment_label: PRE-PRODUCTION
      composer_no_dev: true
      fresh_migration: false
      run_fake_data_seeder: false
      run_super_admin_setup: false
    secrets:
      ftp_server: ${{ secrets.FTP_SERVER_QA }}
      ftp_username: ${{ secrets.FTP_USERNAME_QA }}
      ftp_password: ${{ secrets.FTP_PASSWORD_QA }}
