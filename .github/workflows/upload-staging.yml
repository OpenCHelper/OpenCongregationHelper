name: Upload to Altervista (PRE-PRODUCTION environment)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**"
  workflow_dispatch: # Manually trigger a workflow run

permissions:
  contents: read

# One deployment at a time, to avoid overloading the server: a newer run cancels the one in progress
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml
  linter:
    uses: ./.github/workflows/run-linter.yml
  upload:
    uses: ./.github/workflows/upload-altervista-reusable.yml
    with:
      environment: UAT
      label: PRE-PRODUCTION
      setup-root-user: false
    # The FTP credentials are the secrets of the GitHub environment
    secrets: inherit
    needs:
      - tests
      - linter
