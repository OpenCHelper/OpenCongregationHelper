name: "Preview comment"
description: "Create or update the comment showing the status of the preview of a PR (needs `pull-requests: write`)"
inputs:
  pr:
    description: "Number of the PR."
    required: true
  status:
    description: "One of: deploying, ready, failed, cancelled, removed."
    required: true
  url:
    description: "URL of the preview."
    required: false
    default: ""
  sha:
    description: "Deployed commit."
    required: false
    default: ""
  login:
    description: "Email of the root user of the preview, pre-filled on its login page."
    required: false
    default: ""
  warning:
    description: "Warning shown under a ready or removed preview (e.g. a part of it that failed without blocking it)."
    required: false
    default: ""
  mode:
    description: "`PREVIEW_MODE` of the repository (opt-out, opt-in, off), to explain how to turn the preview on or off. Empty for no hint."
    required: false
    default: ""
  opt-in-label:
    description: "Label of a PR opting in to its preview."
    required: false
    default: "preview: on"
  opt-out-label:
    description: "Label of a PR opting out of its preview."
    required: false
    default: "preview: off"
runs:
  using: "composite"
  steps:
    - name: Create or update the preview comment
      uses: actions/github-script@v8
      env:
        PR_NUMBER: ${{ inputs.pr }}
        PREVIEW_STATUS: ${{ inputs.status }}
        PREVIEW_URL: ${{ inputs.url }}
        PREVIEW_SHA: ${{ inputs.sha }}
        PREVIEW_LOGIN: ${{ inputs.login }}
        PREVIEW_WARNING: ${{ inputs.warning }}
        PREVIEW_MODE: ${{ inputs.mode }}
        OPT_IN_LABEL: ${{ inputs.opt-in-label }}
        OPT_OUT_LABEL: ${{ inputs.opt-out-label }}
      with:
        script: |
          const marker = '<!-- preview-deployment -->';
          const { PR_NUMBER, PREVIEW_STATUS, PREVIEW_URL, PREVIEW_SHA, PREVIEW_LOGIN, PREVIEW_WARNING } = process.env;
          const { PREVIEW_MODE, OPT_IN_LABEL, OPT_OUT_LABEL } = process.env;
          const issue_number = Number(PR_NUMBER);
          const commit = PREVIEW_SHA ? `\`${PREVIEW_SHA.slice(0, 7)}\`` : 'the latest commit';
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const messages = {
            deploying: `⏳ Deploying ${commit} to ${PREVIEW_URL}... ([workflow run](${run}))`,
            ready: [
              `✅ **Ready**: ${PREVIEW_URL} (${commit})`,
              '',
              ...(PREVIEW_WARNING ? [`⚠️ ${PREVIEW_WARNING} ([workflow run](${run}))`, ''] : []),
              `The login page is pre-filled with the root credentials (\`${PREVIEW_LOGIN}\`): just press **Log in** and start testing.`,
              '',
              '> [!WARNING]',
              '> This is a public demo: anyone with the link can log in as root. Do **NOT** save anything resembling real data',
              '> (names, addresses, phone numbers, notes...), only dummy data. The data is reset on every push.',
            ].join('\n'),
            failed: `❌ The deployment of ${commit} failed: see the [workflow run](${run}).`,
            cancelled: `⏹️ The deployment of ${commit} was cancelled (e.g. by a newer push or a change of the preview labels).`,
            removed: PREVIEW_WARNING
              ? `🗑️ The preview was removed, together with its database tables.\n\n⚠️ ${PREVIEW_WARNING} ([workflow run](${run}))`
              : '🗑️ The preview was removed, together with its database tables and its cron jobs.',
          };

          // How to turn the preview off, or back on, following the mode of the repository and the current labels of the
          // PR (e.g. a deployment cancelled by the opt-out label gets the hint to turn it back on). None once it is closed
          const on = `\`${OPT_IN_LABEL}\``;
          const off = `\`${OPT_OUT_LABEL}\``;
          let hint = '';
          if (PREVIEW_MODE) {
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: issue_number });
            const labels = pr.labels.map((label) => label.name);
            const wanted = PREVIEW_MODE !== 'off' && !labels.includes(OPT_OUT_LABEL)
              && (PREVIEW_MODE === 'opt-out' || labels.includes(OPT_IN_LABEL));

            if (pr.state !== 'open') {
              hint = '';
            } else if (PREVIEW_MODE === 'off') {
              hint = 'Previews are turned off for the whole repository (`PREVIEW_MODE` variable).';
            } else if (wanted && PREVIEW_STATUS !== 'removed') {
              hint = PREVIEW_MODE === 'opt-out'
                ? `To remove this preview, add the ${off} label.`
                : `To remove this preview, remove the ${on} label (or add ${off}).`;
            } else if (!wanted) {
              const steps = PREVIEW_MODE === 'opt-out' ? [] : labels.includes(OPT_IN_LABEL) ? [] : [`add the ${on} label`];
              if (labels.includes(OPT_OUT_LABEL)) {
                steps.push(`remove the ${off} label`);
              }
              hint = `To deploy it again, ${steps.join(' and ')}.`;
            }
          }

          const body = [
            `${marker}\n### Preview\n\n${messages[PREVIEW_STATUS] ?? PREVIEW_STATUS}`,
            ...(hint ? [`<sub>💡 ${hint}</sub>`] : []),
          ].join('\n\n');

          const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
          const existing = comments.find((comment) => comment.body?.startsWith(marker));

          if (existing) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
          } else if (PREVIEW_STATUS === 'removed') {
            // e.g. closing a PR that never had a preview (opted out, or `PREVIEW_MODE` `opt-in` or `off`)
            core.info('No preview comment to update.');
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number, body });
          }
