name: "Build application"
description: "Install the dependencies and build the front-end assets of the application, ready to be uploaded to Altervista"
inputs:
  install-dev-dependencies:
    description: "Install the Composer development dependencies."
    required: false
    default: "false"
  node-version:
    description: "Version of Node.js used to build the front-end assets."
    required: false
    default: "20.x"
runs:
  using: "composite"
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # Recreate the Altervista PHP environment (using the `phpinfo()` output)
    - name: Setup PHP and Composer
      uses: shivammathur/setup-php@v2
      with:
        extensions: >-
          bcmath,calendar,ctype,curl,date,dom,exif,fileinfo,filter
          ,gd,gettext,gmp,hash,iconv,imagick,intl,json,libxml,mbstring
          ,mysqli,mysqlnd,openssl,pcre,PDO,pdo_mysql,pdo_sqlite
          ,Phar,random,Reflection,session,SimpleXML,SPL,sqlite3,standard
          ,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib
      env:
        GITHUB_TOKEN: ${{ github.token }}
        fail-fast: true

    - name: Install Composer dependencies
      shell: bash
      env:
        INSTALL_DEV_DEPENDENCIES: ${{ inputs.install-dev-dependencies }}
      run: |
        composer_args=(
          --no-ansi
          --no-interaction
          --no-plugins
          --no-progress
          --no-scripts
          --optimize-autoloader
        )

        if [[ "$INSTALL_DEV_DEPENDENCIES" != 'true' ]]; then
          composer_args+=(--no-dev)
        fi

        composer install "${composer_args[@]}"

    - name: Install NodeJS dependencies
      shell: bash
      run: npm ci

    - name: Run build
      shell: bash
      run: |
        npm run build --if-present && rm -rf node_modules

        chmod -R 775 storage
        php artisan optimize:clear --except=cache || true
        php artisan storage:link --force

        php artisan filament:asset
        php artisan vendor:publish --tag=filament-assets --force
